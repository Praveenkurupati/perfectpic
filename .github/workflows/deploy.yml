name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            # 1. Export standard environment paths for NVM, Node, PNPM, PM2
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
            export PATH="$HOME/.local/share/pnpm:$HOME/.npm-global/bin:$PATH:/usr/local/bin:/usr/bin:/bin"

            # 2. Locate application directory
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              if [ -d "$HOME/perfectpic" ]; then
                APP_DIR="$HOME/perfectpic"
              elif [ -d "$HOME/whitebook" ]; then
                APP_DIR="$HOME/whitebook"
              elif [ -d "/var/www/perfectpic" ]; then
                APP_DIR="/var/www/perfectpic"
              elif [ -d "/var/www/whitebook" ]; then
                APP_DIR="/var/www/whitebook"
              else
                APP_DIR="$HOME/perfectpic"
              fi
            fi

            echo "🚀 Navigating to project directory: $APP_DIR"
            cd "$APP_DIR" || { echo "❌ Failed to change directory to $APP_DIR"; exit 1; }

            # 3. Pull latest code from main branch cleanly
            echo "📥 Pulling latest updates from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            # 4. Install dependencies using pnpm
            echo "📦 Installing dependencies with pnpm..."
            pnpm install --frozen-lockfile || pnpm install

            # 5. Build applications
            echo "🔨 Building applications..."
            export NODE_OPTIONS="--max-old-space-size=2048"
            pnpm build

            # 6. Restart/Reload PM2 services
            echo "🔄 Reloading PM2 services..."
            if [ -f "ecosystem.config.js" ]; then
              pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js || pm2 restart all
            else
              pm2 reload all || pm2 restart all
            fi

            pm2 save
            echo "✅ Deployment completed successfully!"
