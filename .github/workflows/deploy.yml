name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            # 1. Export standard environment paths for NVM, Node, PNPM, PM2
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
            export PATH="$HOME/.local/share/pnpm:$HOME/.npm-global/bin:$PATH:/usr/local/bin:/usr/bin:/bin"

            # 2. Locate application directory
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              if [ -d "$HOME/perfectpic" ]; then
                APP_DIR="$HOME/perfectpic"
              elif [ -d "$HOME/whitebook" ]; then
                APP_DIR="$HOME/whitebook"
              elif [ -d "/var/www/perfectpic" ]; then
                APP_DIR="/var/www/perfectpic"
              elif [ -d "/var/www/whitebook" ]; then
                APP_DIR="/var/www/whitebook"
              else
                APP_DIR="$HOME/perfectpic"
              fi
            fi

            echo "🚀 Navigating to project directory: $APP_DIR"
            cd "$APP_DIR" || { echo "❌ Failed to change directory to $APP_DIR"; exit 1; }

            # 3. Pull latest code from main branch cleanly and detect changed apps
            echo "📥 Inspecting commits and pulling latest updates from origin/main..."
            PREV_REV=$(git rev-parse HEAD 2>/dev/null || echo "HEAD~1")
            git fetch origin main
            git reset --hard origin/main
            NEW_REV=$(git rev-parse HEAD)

            # Determine changed workspaces
            CHANGED_FILES=$(git diff --name-only "$PREV_REV" "$NEW_REV" 2>/dev/null || echo "")

            CLIENT_CHANGED=false
            ADMIN_CHANGED=false
            BACKEND_CHANGED=false

            if echo "$CHANGED_FILES" | grep -qE "(^apps/client/|^packages/|pnpm-lock.yaml|package.json|turbo.json)"; then
              CLIENT_CHANGED=true
            fi
            if echo "$CHANGED_FILES" | grep -qE "(^apps/admin/|^packages/|pnpm-lock.yaml|package.json|turbo.json)"; then
              ADMIN_CHANGED=true
            fi
            if echo "$CHANGED_FILES" | grep -qE "(^apps/backend/|^packages/|pnpm-lock.yaml|package.json|turbo.json)"; then
              BACKEND_CHANGED=true
            fi

            # Fallback: if no diff detected between revisions, inspect latest commit changes
            if [ -z "$CHANGED_FILES" ] || [ "$PREV_REV" = "$NEW_REV" ]; then
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
              if [ -n "$CHANGED_FILES" ]; then
                CLIENT_CHANGED=false
                ADMIN_CHANGED=false
                BACKEND_CHANGED=false
                if echo "$CHANGED_FILES" | grep -qE "(^apps/client/|^packages/|pnpm-lock.yaml|package.json|turbo.json)"; then
                  CLIENT_CHANGED=true
                fi
                if echo "$CHANGED_FILES" | grep -qE "(^apps/admin/|^packages/|pnpm-lock.yaml|package.json|turbo.json)"; then
                  ADMIN_CHANGED=true
                fi
                if echo "$CHANGED_FILES" | grep -qE "(^apps/backend/|^packages/|pnpm-lock.yaml|package.json|turbo.json)"; then
                  BACKEND_CHANGED=true
                fi
              else
                CLIENT_CHANGED=true
                ADMIN_CHANGED=true
                BACKEND_CHANGED=true
              fi
            fi

            echo "📊 Change Detection:"
            echo "   • Client changed:  $CLIENT_CHANGED"
            echo "   • Admin changed:   $ADMIN_CHANGED"
            echo "   • Backend changed: $BACKEND_CHANGED"

            # 4. Install dependencies using pnpm (skip if lockfile & package.json untouched)
            if echo "$CHANGED_FILES" | grep -qE "(pnpm-lock.yaml|package.json)"; then
              echo "📦 Package files updated. Installing dependencies with pnpm..."
              pnpm install --frozen-lockfile || pnpm install
            else
              echo "⏩ Dependencies unchanged. Skipping full pnpm install to accelerate deploy."
            fi

            # 5. Smart Selective Build with memory isolation
            echo "🔨 Building applications selectively..."
            export NODE_OPTIONS="--max-old-space-size=2048"

            pnpm --filter=@repo/types build 2>/dev/null || true

            if [ "$CLIENT_CHANGED" = "true" ]; then
              echo "⚡ Compiling @repo/client..."
              pnpm --filter=@repo/client build
            else
              echo "⏩ Skipping @repo/client (0 changes detected)"
            fi

            if [ "$ADMIN_CHANGED" = "true" ]; then
              echo "⚡ Compiling @repo/admin..."
              pnpm --filter=@repo/admin build
            else
              echo "⏩ Skipping @repo/admin (0 changes detected)"
            fi

            if [ "$BACKEND_CHANGED" = "true" ]; then
              echo "⚡ Compiling @repo/backend..."
              pnpm --filter=@repo/backend build
            else
              echo "⏩ Skipping @repo/backend (0 changes detected)"
            fi

            # 6. Restart/Reload PM2 services selectively
            echo "🔄 Reloading PM2 services..."
            if [ -f "ecosystem.config.js" ]; then
              if [ "$CLIENT_CHANGED" = "true" ]; then pm2 reload perfectpic-client --update-env || pm2 restart perfectpic-client || true; fi
              if [ "$ADMIN_CHANGED" = "true" ]; then pm2 reload perfectpic-admin --update-env || pm2 restart perfectpic-admin || true; fi
              if [ "$BACKEND_CHANGED" = "true" ]; then pm2 reload perfectpic-backend --update-env || pm2 restart perfectpic-backend || true; fi
            else
              pm2 reload all || pm2 restart all
            fi

            pm2 save
            echo "✅ Deployment completed successfully!"
