name: Build & Publish Docker Containers (CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-build-and-push
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ── 1. Detect Changes to Avoid Redundant Builds ──────────────────────────────
  detect-changes:
    name: Detect Changed Applications
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'packages/**'
              - 'docker/backend.Dockerfile'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'
            admin:
              - 'apps/admin/**'
              - 'packages/**'
              - 'docker/admin.Dockerfile'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'
            client:
              - 'apps/client/**'
              - 'packages/**'
              - 'docker/client.Dockerfile'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'

  # ── 2. Parallel Independent Build Jobs ───────────────────────────────────────
  build-backend:
    name: Build & Push Backend
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Lowercase Registry Names
        run: |
          OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "OWNER_PREFIX=ghcr.io/${OWNER_LOWER}" >> $GITHUB_ENV
          echo "REPO_PREFIX=ghcr.io/${REPO_LOWER}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.OWNER_PREFIX }}/perfectpic-backend:latest
            ${{ env.OWNER_PREFIX }}/perfectpic-backend:${{ github.sha }}
            ${{ env.REPO_PREFIX }}/perfectpic-backend:latest
            ${{ env.REPO_PREFIX }}/perfectpic-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-admin:
    name: Build & Push Admin
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Lowercase Registry Names
        run: |
          OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "OWNER_PREFIX=ghcr.io/${OWNER_LOWER}" >> $GITHUB_ENV
          echo "REPO_PREFIX=ghcr.io/${REPO_LOWER}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/admin.Dockerfile
          push: true
          tags: |
            ${{ env.OWNER_PREFIX }}/perfectpic-admin:latest
            ${{ env.OWNER_PREFIX }}/perfectpic-admin:${{ github.sha }}
            ${{ env.REPO_PREFIX }}/perfectpic-admin:latest
            ${{ env.REPO_PREFIX }}/perfectpic-admin:${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  build-client:
    name: Build & Push Client
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Lowercase Registry Names
        run: |
          OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "OWNER_PREFIX=ghcr.io/${OWNER_LOWER}" >> $GITHUB_ENV
          echo "REPO_PREFIX=ghcr.io/${REPO_LOWER}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/client.Dockerfile
          push: true
          tags: |
            ${{ env.OWNER_PREFIX }}/perfectpic-client:latest
            ${{ env.OWNER_PREFIX }}/perfectpic-client:${{ github.sha }}
            ${{ env.REPO_PREFIX }}/perfectpic-client:latest
            ${{ env.REPO_PREFIX }}/perfectpic-client:${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  # ── 3. Deployment Step ───────────────────────────────────────────────────────
  deploy-ec2:
    name: Deploy Containers to AWS EC2
    needs: [detect-changes, build-backend, build-admin, build-client]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (vars.ENABLE_AUTO_DEPLOY == 'true' || secrets.EC2_HOST != '') &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-admin.result == 'success' || needs.build-admin.result == 'skipped') &&
      (needs.build-client.result == 'success' || needs.build-client.result == 'skipped') &&
      !(needs.build-backend.result == 'skipped' && needs.build-admin.result == 'skipped' && needs.build-client.result == 'skipped')
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            APP_DIR="${{ secrets.EC2_APP_DIR || '/var/www/perfectpic' }}"
            cd "$APP_DIR"

            echo "📥 Fetching latest compose and config updates..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔑 Authenticating Docker to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true

            echo "🚀 Pulling pre-built containers from GHCR..."
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            echo "⚡ Starting updated production containers..."
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            echo "🧹 Cleaning unused old images to conserve disk space..."
            sudo docker image prune -f

            echo "✅ Deployment finished successfully in seconds!"
